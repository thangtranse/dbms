name: dbms

services:
  office-lunch:
    build:
      context: ./office-lunch
    image: dbms/office-lunch:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OFFICE_LUNCH_PORT:-3000}:3000"
    environment:
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      NEXT_TELEMETRY_DISABLED: "1"
      BACKEND_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - databases

  api: &backend
    build: ./backend
    image: dbms/office-lunch-api:local
    restart: unless-stopped
    env_file: .env
    environment:
      QDRANT_URL: "${QDRANT_URL:-http://100.65.210.21:6333}"
      TERADATA_DATABASE: "${TERADATA_DATABASE:-officelunch}"
      ARTIFACT_DIR: /app/artifacts
      FOOD_PATH: /data/food.txt
    volumes:
      - ./backend/artifacts:/app/artifacts
      - ./office-lunch/pipeline/data/food.txt:/data/food.txt:ro
    ports:
      - "127.0.0.1:${OFFICE_LUNCH_API_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/live')"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [databases]

  vector-worker:
    <<: *backend
    profiles: ["local-worker"]
    ports: []
    command: ["python", "-m", "ol.cli", "sync", "--loop"]
    healthcheck:
      disable: true

  qdrant:
    profiles: ["local-qdrant"]
    image: qdrant/qdrant:v1.19.2
    container_name: dbms-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    environment:
      QDRANT__LOG_LEVEL: "${QDRANT_LOG_LEVEL:-INFO}"
      QDRANT__SERVICE__API_KEY: "${QDRANT_API_KEY:-local-dev-key-change-me}"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - databases

  teradata-client:
    profiles: ["teradata"]
    build:
      context: ./teradata-client
      args:
        TERADATASQL_VERSION: "${TERADATASQL_VERSION:-20.0.0.72}"
    image: dbms/teradata-client:${TERADATASQL_VERSION:-20.0.0.72}
    container_name: dbms-teradata-client
    restart: unless-stopped
    environment:
      TERADATA_HOST: "${TERADATA_HOST:-}"
      TERADATA_USER: "${TERADATA_USER:-dbc}"
      TERADATA_PASSWORD: "${TERADATA_PASSWORD:-}"
      TERADATA_LOGMECH: "${TERADATA_LOGMECH:-TD2}"
      TERADATA_ENCRYPTDATA: "${TERADATA_ENCRYPTDATA:-true}"
    command: ["sh", "-c", "python /app/healthcheck.py && exec tail -f /dev/null"]
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 10s
    networks:
      - databases

volumes:
  qdrant_data:
    name: dbms_qdrant_data

networks:
  databases:
    name: dbms_databases

